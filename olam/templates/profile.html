{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">TU ESPACIO</span><h1>Mi cuenta</h1><p class="muted">{{ g.user.name }} · {{ g.user.role }} · {{ g.user.username }}</p></div></div><section class="card form-card narrow">{{ field_error(error) }}<h2>Cambiar contraseña</h2><form method="post" data-busy><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="current_password">Contraseña actual *</label><input id="current_password" name="current_password" type="password" maxlength="128" autocomplete="current-password" required></div><div class="field"><label for="new_password">Nueva contraseña *</label><input id="new_password" name="new_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><small>De 10 a 128 caracteres.</small></div><div class="field"><label for="confirm_password">Repite la nueva contraseña *</label><input id="confirm_password" name="confirm_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></div><button class="button">Actualizar contraseña</button><p class="field-hint">Después del cambio tendrás que iniciar sesión nuevamente.</p></form></section>{% endblock %}
